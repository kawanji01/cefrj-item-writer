name: deterministic-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed product dependencies and spaCy model
        run: python scripts/setup.py
      - name: Install fixed test dependency
        run: .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run deterministic unit and replay tests
        run: .venv/bin/python -m pytest tests/unit tests/replay
